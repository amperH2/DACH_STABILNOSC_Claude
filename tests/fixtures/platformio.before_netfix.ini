[platformio]
default_envs = poe_main

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/load_config.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit BME280 Library@2.3.0
  adafruit/Adafruit BMP085 Library@1.2.4
  adafruit/Adafruit BMP280 Library@3.0.0
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit MLX90614 Library@2.1.6
  adafruit/Adafruit SI1145 Library@1.2.2
  adafruit/Adafruit TSL2591 Library@1.4.5
  adafruit/Adafruit Unified Sensor@1.1.15
  claws/BH1750@1.3.0
  milesburton/DallasTemperature@4.0.6
  adafruit/DHT sensor library@1.4.7
  mobizt/ESP_SSLClient@3.1.3
  arduino-libraries/Ethernet@2.0.2
  paulstoffregen/OneWire@2.3.8
  knolleary/PubSubClient@2.8.0
  bblanchon/ArduinoJson@6.21.5

[env:poe_main]
build_src_filter = +<main.cpp>

[env:eth_8ro_spare]
build_src_filter = +<main.cpp>

[env:rs485_service]
build_src_filter = +<rs485_service.cpp>
