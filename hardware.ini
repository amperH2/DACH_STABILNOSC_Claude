; CENTRALNA KONFIGURACJA SPRZETU. Zmieniaj tutaj, nie w main.cpp ani secrets.ini.
; Przelaczniki maja tylko wartosci 0 lub 1. Bledy/konflikty zatrzymuja build.
[common]
; Lokalne DO1-DO7 tylko na POE; start OFF, bez przywracania stanu.
LOCAL_DO_ENABLED = 1
DO1_ENABLED = 1
DO2_ENABLED = 1
DO3_ENABLED = 1
DO4_ENABLED = 1
DO5_ENABLED = 1
DO6_ENABLED = 1
DO7_ENABLED = 1
; 0 = testy bez ruchu. 1 dopiero po sprawdzeniu instalacji i blokad.
ROOF_MOTION_ENABLED = 1
USE_WIFI = 1
USE_W5500 = 1
USE_TELEGRAM = 1
USE_MQTT = 0
; 0 = lokalny broker TCP; 1 = TLS bez weryfikacji certyfikatu (odziedziczone ograniczenie).
MQTT_TLS_ENABLED = 0
USE_OTA = 0
USE_TASK_WDT = 1
PARK_GUARD_ENABLED = 1
; Operator confirmed 2026-10-21: roof closes clear of equipment in ALL mount positions.
; CLOSE and communication-fault recovery follow geometry; OPEN always requires PARK.
; Set 0 BEFORE changing instrument until clearance in ALL positions is verified.
CLOSE_CLEARANCE_CONFIRMED = 1
MOUNT_LIMIT_ENABLED = 1
MOUNT_ESTOP_BLOCKS_CLOSE = 0
COLLISION_SENSOR_ENABLED = 0
; 1 rezerwuje CH4 (odbiera AUX4); wymaga COLLISION_SENSOR_ENABLED=1.
COLLISION_POWER_RELAY_ENABLED = 0
; 1 rezerwuje CH5 (odbiera AUX5); wymaga MOUNT_LIMIT_ENABLED=1.
MOUNT_POWER_RELAY_ENABLED = 1
COMMS_WATCHDOG_ENABLED = 1
COMMS_LOST_AUTOPARK = 0
; Pozostaw 0; obejscie potwierdzenia Park wymaga oceny mechaniki.
FORCE_CLOSE_ALLOW_IGNORE_PARK = 0
ROOF_INTERLOCK_RELAYS = 1
ROOF_BLOCK_REDUNDANT_COMMANDS = 1
ENABLE_RG11 = 1
RG11_RAIN_WHEN_LOW = 1
ANEMOMETER_ENABLED = 1
WIND_FAULT_UNSAFE = 1
MLX_FAIL_UNSAFE = 1
ENABLE_MLX90614 = 1
ENABLE_MLX90614_2 = 1
; GPIO47; TF musi pozostac bez karty. Wyjscie danych 3.3 V.
ENABLE_DHT22 = 1
; GPIO48; TF musi pozostac bez karty. Pull-up DQ do 3.3 V.
ENABLE_DS18B20 = 0
ENABLE_BH1750 = 1
ENABLE_TSL2591 = 1
ENABLE_SI1145 = 1
ENABLE_BMP280 = 0
ENABLE_BME280 = 1
RTC_ENABLED = 1
; Active SIM900 remains unchanged; optional SIM7600 uses the SAME UART.
SIM900_ENABLED = 1
SIM7600_ENABLED = 0
; 1 only after installing a verified RS232 level converter (if using RS232 socket).
SIM7600_RS232_CONFIRMED = 0
PUSHOVER_ENABLED = 1
HEARTBEAT_ENABLED = 1
PUSHOVER_RETRY_SEC = 60
PUSHOVER_EXPIRE_SEC = 1800
HEARTBEAT_INTERVAL_SEC = 60
LOCAL_ALARM_ENABLED = 1
; Obsluga magistrali modulu PWM. Grzalki i LED maja osobne flagi.
PWM_MODULE_ENABLED = 1
; Trzy glowne grzalki PWM; kazdy kanal dodatkowo wlaczany na WWW.
HEATER_PWM_ENABLED = 1
; Czerwone swiatlo PWM CH4; start OFF. Moze dzialac bez grzalek.
LED_PWM_ENABLED = 1
; Lokalne swiatlo DO8; zawsze 0 w zapasie 8RO (CH8 jest AUX3).
ILLUM_DO_ENABLED = 1
EVENT_LOG_PERSISTENT = 1
MODBUS_RELAY_LOG = 1
RELAY_LOG = 0
DIAG_TLS_DEBUG = 0
DIAG_NET_TEST = 0
; 0 = zachowany statyczny adres .240; 1 = diagnostyczne DHCP.
DIAG_ETH_DHCP = 0
AUX1_ENABLED = 1
AUX2_ENABLED = 1
AUX3_ENABLED = 1
AUX4_ENABLED = 1
AUX5_ENABLED = 1

; Parametry wspolne, nie przelaczniki.
MODBUS_RELAY_ADDR = 1
HEATER_PWM_ADDR = 2
MODBUS_RELAY_BAUD = 9600
MODBUS_RELAY_RESPONSE_TIMEOUT_MS = 200
MODBUS_RELAY_POLL_MS = 1000
PWM_FREQ_HZ = 1000
HEATER_MANUAL_TIMEOUT_MIN = 120
HEATER_PWM_MAX_SENSOR_AGE_MS = 10000
ROOF_TIMEOUT_SEC = 120
PARK_SETTLE_MS = 5000
COMMS_LOST_TIMEOUT_MS = 300000
NET_MODE_DEFAULT = 0
PARK_ALPACA_PORT = 11111
MQTT_PORT = 1883
SIM_BAUD = 9600
SMS_MAX_PER_HOUR = 8
LED_PWM_CHANNEL = 4
OBS_TCA_I2C_ADDR = 32
; 8RO: producent potwierdza HIGH=ON, LOW=OFF. Nie odwracaj bez zmiany sprzetu.
RELAY_ACTIVE_LOW_CFG = 0

[poe_main]
OBS_BOARD_8RO = 0

[eth_8ro_spare]
OBS_BOARD_8RO = 1
ILLUM_DO_ENABLED = 0

[rs485_service]
OBS_BOARD_8RO = 0
ROOF_MOTION_ENABLED = 0

